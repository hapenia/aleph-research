# AlephResearch extension layer for the dsh-superagent profile.
- insert:
    - id: aleph-superagent
      name: '@local/dsh-aleph-superagent'
    # Registered before the routing Session starts, so its tool restriction can name
    # aleph_request_work (a later registration would be rejected as unknown).
    - id: aleph-request-tool
      name: '@local/dsh-aleph-superagent/request-tool'
    # The AlephResearch host plane. `research-storage` opens the `aleph_research` domain
    # over DSH's `storageDomain` service (the base profile mounts `storage-domain` with
    # the JSON backend) and provides `alephResearchStore`; `research-host` registers the
    # read/write routes under /aleph/api/research/ and uses that store when it is already
    # provided; `research-tools` registers the compiled role tool catalog and binds the
    # host service's executeTool when it is present.
    - id: aleph-research-storage
      name: '@local/dsh-aleph-superagent/research-storage'
    - id: aleph-research-host
      name: '@local/dsh-aleph-superagent/research-host'
      config:
        # A test deployment needs the Operator to create Programs/Issues and a
        # Researcher principal to claim an Issue and propose an Experiment. The
        # production composition should narrow this to the sessions it really mounts.
        actorKinds: ["operator", "researcher"]
    # The trigger bridge delivers typed research trigger drafts to the prototype
    # Source's Eval path. It reads the optional host service late-bound.
    - id: aleph-research-trigger-bridge
      name: '@local/dsh-aleph-superagent/research-trigger-bridge'
    # The research Session pool. `research-sessions` injects only
    # `sessionController` and `workspaceRegistry`; it reads the optional
    # `alephResearchHost` service with `ctx.get`, never as an injection, so this row
    # also mounts when the host row above is absent. A deployment enables session
    # creation by passing `{ poolSize, workspaceId }`; the default creates none.
    - id: aleph-research-sessions
      name: '@local/dsh-aleph-superagent/research-sessions'
    - id: aleph-research-tools
      name: '@local/dsh-aleph-superagent/research-tools'
    # The Watchdog Session is its own agent preset: it receives periodic briefs and
    # may stop or retry a stuck ticket. Not offered for manual selection.
    - id: aleph-watchdog-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: aleph-watchdog
        name: AlephResearch Watchdog
        description: AlephResearch 常驻看门狗，接收停滞简报并可停止或重试工单，不供手动选择。
        order: 95
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are the AlephResearch watchdog. Each brief lists open tickets, stalled
                tickets and evaluation results. Act only on stalled tickets: call
                aleph_watchdog_stop for a ticket stuck far beyond the stale line, or
                aleph_watchdog_retry for one whose assignment ended without progress. Do
                not invent tickets and do not start new work. End the turn after acting;
                the next brief arrives on its own.
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
    # The research Session presets. The pool above creates Sessions with these ids; a
    # preset row has no picker flag, so the names and descriptions say whom they are for
    # and that they are not offered for manual selection. Orders follow the existing
    # presets (worker 90, router 91, watchdog 95).
    - id: aleph-operator-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: aleph-operator
        name: AlephResearch Operator
        description: AlephResearch 操作员 Session 专用，通过 aleph_research_* 工具创建 Program 与 Issue、设置探索级别、暂停或停止 Program 并处理 attention，不供手动选择。
        order: 96
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are the AlephResearch Operator. You operate the research Program
                through the aleph_research_* tools: create Programs and Issues, set the
                exploration level, pause, resume or stop a Program, and act on attention
                raised for it. Report each change in one short summary. Do not implement
                code and do not act as a Researcher or Implementer.
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
    - id: aleph-researcher-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: aleph-researcher
        name: AlephResearch Researcher
        description: AlephResearch 研究员 Session 专用，负责被指派的 Issue、提出 Experiment、请求 CI 并评审结果，不修改代码，不供手动选择。
        order: 97
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are an AlephResearch Researcher. You own the Issues assigned to you;
                propose Experiments, request CI runs and review results through the
                aleph_research_* tools. Never edit code: implementation belongs to an
                Implementer. Keep each Experiment small and tied to the Program's
                evaluation contract.
          # `tool-fs` registers only its read side here: the Researcher inspects the
          # repository and experiment inputs, but the write/edit tools stay absent.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: false
              write: false
              edit: false
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
