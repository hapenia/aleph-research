[package]
name = "aleph-research-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
getset = "0.1.7"
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
thiserror = "2"
wasm-bindgen = "0.2.130"

[dev-dependencies]
trybuild = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
