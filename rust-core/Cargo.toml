[package]
name = "aleph-research-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
getset = "0.1.7"
serde = "1.0.229"
serde-wasm-bindgen = "0.6.5"
thiserror = "2"
wasm-bindgen = "0.2.130"

[dev-dependencies]
trybuild = "1"
ts-rs = "12.0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
