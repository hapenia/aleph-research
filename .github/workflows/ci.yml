name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    name: extension syntax and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked

      - name: Install dependencies
        working-directory: superagent-extension
        run: npm install --no-audit --no-fund

      - name: Check syntax
        run: |
          node --check superagent-extension/index.js
          node --check superagent-extension/research-extension.js
          node --check superagent-extension/client.js

      - name: Check shell syntax
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done

      - name: Typecheck and lint research core
        working-directory: research-core
        run: |
          npm install --no-audit --no-fund
          npm run generate
          npm run typecheck
          npm run lint
          npm run check:completion
          npm run test:mutation
          npm test
          bash scripts/lint-fixtures.sh
          npm run build
          npm run test:dist
          bash scripts/build-check.sh

      - name: Run extension tests
        working-directory: superagent-extension
        run: npm test

      - name: Lint the research extension adapter
        working-directory: superagent-extension
        run: npm run -s lint
